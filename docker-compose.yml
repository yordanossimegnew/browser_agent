services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: browser_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d browser_agent"]
      interval: 2s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/browser_agent
    ports:
      - "8000:8000"
    env_file: .env
    shm_size: "1gb"   # Chromium needs more shared memory than Docker's 64 MB default
    volumes:
      - ./logs:/app/logs

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      AGENT_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
